spring:
  application:
    name: appliance-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/appliance"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on
  # The one connection of the service: the virtual host of the notifications, where it publishes the
  # household category (NotificationPublisher of cholewa-commons). It consumes nothing - the plugs are
  # Gen1 and polled, so no /device. Confirms, returns and the mandatory flag are what the publisher
  # needs to know a notification reached a queue; it refuses to start without them
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: notification
    # no default on purpose: cholewa.required-properties refuses the start without it
    password: ${rabbitmq-password}
    virtual-host: /notification
    connection-timeout: 10s
    requested-heartbeat: 10s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # defaults to false; without it the trace breaks at the broker
      observation-enabled: true

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows (heating 2 /
    # database 4 / water 2 / presence 2 / blinds 2 / weather 2 / light 2 / appliance 2 - 18 allotted,
    # HAS-277). A rollout holds the pool twice and Flyway opens one more connection; one rolling
    # service at a time stays at 21. The last service with a database before the shares are re-cut
    max-size: 2

cholewa:
  # refuses the start before the first bean when one of these has no value (cholewa-commons >= 1.9.0)
  required-properties:
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
  notification:
    enabled: true
    env: prod

# how long the samples of the plugs are kept (ApplianceProperties): a bare number is days, 2 to 90; deleted
# every night at 03:20
appliance:
  sample-retention: 14d
  # the availability monitor of the plugs (HAS-280): out after five minutes without a reading, named again every
  # hour while out; on the technical channel (alert / info), never the household's
  monitor:
    offline-after: PT5M
    reminder-every: PT1H

internal:
  service:
    database: http://database-service:6200

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8013 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

cholewa:
  notification:
    # a run outside the cluster publishes into the dev queue, never to the household
    env: dev

internal:
  service:
    database: http://localhost:6005

server:
  port: 6013
management:
  server:
    port: 8013

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  # nothing listens here: a test that reaches the broker fails instead of publishing
  rabbitmq:
    host: localhost
    port: 1
    password: test

cholewa:
  notification:
    env: dev

# second line of defence: SchedulingConfig schedules nothing under this profile, and a test that calls
# database-service all the same must not reach a real one
internal:
  service:
    database: http://localhost:1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
